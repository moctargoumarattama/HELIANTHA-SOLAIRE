<div class="ha-chat nudge-hidden" id="ha-chat" data-endpoint="{{ url_for('main.assistant_chat') }}" data-logo="{{ url_for('main.brand_image') }}">
  <div class="ha-chat-nudge" id="ha-chat-nudge">
    <strong>Bonjour, je suis l'assistant IA de HeliAntha</strong>
    <span>Posez-moi votre question ici.</span>
  </div>

  <button class="ha-chat-launcher" type="button" id="ha-chat-launcher" aria-expanded="false" aria-controls="ha-chat-panel">
    <span class="ha-chat-icon" aria-hidden="true"><img src="{{ url_for('main.brand_image') }}" alt=""></span>
    <span class="ha-chat-help">Conseiller IA</span>
  </button>

  <section class="ha-chat-panel" id="ha-chat-panel" aria-label="Conseiller HeliAntha" hidden>
    <header class="ha-chat-header">
      <div>
        <strong>Conseiller HeliAntha</strong>
        <small><span></span> En ligne</small>
      </div>
      <button class="ha-chat-close" type="button" id="ha-chat-close" aria-label="Fermer le conseiller">x</button>
    </header>

    <div class="ha-chat-log" id="ha-chat-log" aria-live="polite"></div>

    <div class="ha-chat-suggestions" id="ha-chat-suggestions">
      <button type="button">Pompage solaire agricole</button>
      <button type="button">Reduire ma facture d'electricite</button>
      <button type="button">Site isole / Sans reseau</button>
      <button type="button">Borne de recharge electrique</button>
    </div>

    <form class="ha-chat-form" id="ha-chat-form">
      <input id="ha-chat-input" type="text" autocomplete="off" maxlength="1000" placeholder="Ecrivez votre message..." aria-label="Message">
      <button type="submit" aria-label="Envoyer">&#10148;</button>
    </form>
  </section>
</div>
