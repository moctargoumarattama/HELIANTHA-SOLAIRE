<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}HELIANTHA Admin{% endblock %}</title>
  <meta name="theme-color" content="#102638">
  <meta name="application-name" content="HELIANTHA">
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <meta name="apple-mobile-web-app-title" content="HELIANTHA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="{{ url_for('main.brand_image') }}" type="image/jpeg">
  <link rel="apple-touch-icon" href="{{ url_for('main.brand_image') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=20261007-no-stock">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_ajax.css') }}">
</head>
<body class="admin-app">
  <div class="admin-backdrop" id="admin-backdrop" aria-hidden="true"></div>
  <aside class="admin-sidebar" id="admin-sidebar">
    <a class="admin-brand" href="{{ url_for('main.admin_dashboard') }}">
      <span class="admin-mark" aria-hidden="true"><img class="admin-logo" src="{{ url_for('main.brand_image') }}" alt=""></span>
      <div><b>HELIANTHA</b><small>ADMIN</small></div>
    </a>
    <nav>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_dashboard' %} active{% endif %}" href="{{ url_for('main.admin_dashboard') }}">Tableau de bord</a>
      <a class="admin-nav-link{% if request.endpoint in ('main.admin_quotes', 'main.admin_quote_detail', 'main.admin_quote_pdf') %} active{% endif %}" href="{{ url_for('main.admin_quotes') }}">Devis</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_catalog' %} active{% endif %}" href="{{ url_for('main.admin_catalog') }}">Catalogue</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_pumping_method' %} active{% endif %}" href="{{ url_for('main.admin_pumping_method') }}">Méthode Pompage</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_pumping_rules' %} active{% endif %}" href="{{ url_for('main.admin_pumping_rules') }}">Règles Pompage solaire</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_ongrid_rules' %} active{% endif %}" href="{{ url_for('main.admin_ongrid_rules') }}">Règles On-Grid</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_tva' %} active{% endif %}" href="{{ url_for('main.admin_tva') }}"><span aria-hidden="true">%</span> TVA &amp; Transport</a>
      <a class="admin-nav-link{% if request.endpoint and request.endpoint.startswith('main.admin_whatsapp') %} active{% endif %}" href="{{ url_for('main.admin_whatsapp') }}">WhatsApp</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_users' %} active{% endif %}" href="{{ url_for('main.admin_users') }}">Utilisateurs</a>
      <a class="admin-nav-link{% if request.endpoint == 'main.admin_settings' %} active{% endif %}" href="{{ url_for('main.admin_settings') }}">Paramètres</a>
    </nav>
  </aside>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="admin-menu-toggle" type="button" id="admin-menu-toggle" aria-expanded="false" aria-controls="admin-sidebar" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
        <small>Menu</small>
      </button>
      <div>
        <small>HELIANTHA Smart Quote</small>
        <h1>{% block page_title %}Administration{% endblock %}</h1>
      </div>
      <div class="admin-topbar-actions">
        <form method="post" action="{{ url_for('main.admin_logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
          <button class="ghost-button" type="submit">Déconnexion</button>
        </form>
      </div>
    </header>
    <main class="admin-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="admin-toast-container" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/admin_ajax.js') }}"></script>
  <script>
    (() => {
      const toggle = document.getElementById("admin-menu-toggle");
      const backdrop = document.getElementById("admin-backdrop");
      const body = document.body;
      const sidebar = document.querySelector(".admin-sidebar");
      if (!toggle || !backdrop || !sidebar) return;

      const setOpen = (open) => {
        body.classList.toggle("admin-menu-open", open);
        toggle.setAttribute("aria-expanded", String(open));
      };

      toggle.addEventListener("click", () => setOpen(!body.classList.contains("admin-menu-open")));
      backdrop.addEventListener("click", () => setOpen(false));

      sidebar.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          if (window.matchMedia("(max-width: 980px)").matches) setOpen(false);
        });
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setOpen(false);
      });

      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 980px)").matches) setOpen(false);
      });
    })();
  </script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
